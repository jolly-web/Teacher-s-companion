<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teacher's Companion</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f0f3f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-box { background: white; padding: 48px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
    .login-box h1 { color: #1a2744; font-size: 1.5rem; margin-bottom: 8px; }
    .login-box p { color: #6b7a99; font-size: 0.9rem; margin-bottom: 24px; }
    label { display: block; font-size: 0.75rem; font-weight: 600; color: #6b7a99; margin-bottom: 4px; margin-top: 16px; }
    label:first-of-type { margin-top: 0; }
    input[type="text"], input[type="password"] { width: 100%; padding: 10px 12px; border: 1px solid #d8dff0; border-radius: 7px; font-family: inherit; font-size: 0.9rem; }
    input:focus { outline: none; border-color: #1a2744; }
    .btn-login { width: 100%; padding: 12px; background: #f5a623; border: none; border-radius: 7px; font-family: inherit; font-size: 0.9rem; font-weight: 700; color: #1a2744; cursor: pointer; margin-top: 24px; }
    .btn-login:hover { background: #d4891a; }
    .register-link { text-align: center; margin-top: 16px; font-size: 0.85rem; color: #6b7a99; }
    .register-link a { color: #1a2744; font-weight: 600; text-decoration: none; }
    .register-link a:hover { text-decoration: underline; }
    #login-msg { margin-top: 12px; font-size: 0.8rem; font-weight: 500; min-height: 20px; }
    #login-msg.error { color: #c0392b; }
    #login-msg.success { color: #2e7d52; }
  </style>
</head>
<body>
<div class="login-box">
  <h1>🔐 Login</h1>
  <p>Enter your credentials to access your grade tracker</p>
  
  <label>Username</label>
  <input type="text" id="username" placeholder="Enter your username" />
  
  <label>Password</label>
  <input type="password" id="password" placeholder="Enter your password" />
  
  <button class="btn-login" onclick="login()">Login</button>
  <p id="login-msg"></p>
  
  <div class="register-link">
    Don't have an account? <a href="/register">Register here</a>
  </div>
</div>

<script>
async function login() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const msg = document.getElementById("login-msg");
  
  if (!username || !password) {
    msg.className = "error";
    msg.textContent = "Please enter both username and password.";
    return;
  }
  
  const res = await fetch("/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({username, password})
  });
  
  const data = await res.json();
  
  if (res.ok) {
    msg.className = "success";
    msg.textContent = "✅ Login successful! Redirecting...";
    setTimeout(() => window.location.href = "/", 1000);
  } else {
    msg.className = "error";
    msg.textContent = data.error || "Login failed. Please try again.";
  }
}

// Allow Enter key to submit
document.addEventListener("keypress", function(e) {
  if (e.key === "Enter") login();
});
</script>
</body>
</html>
