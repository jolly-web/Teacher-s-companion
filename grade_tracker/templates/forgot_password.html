<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teacher's Companion</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a2744">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f0f3f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .box { background: white; padding: 48px 40px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); width: 100%; max-width: 460px; }
    .box h1 { color: #1a2744; font-size: 1.5rem; margin-bottom: 8px; }
    .box p { color: #6b7a99; font-size: 0.9rem; margin-bottom: 24px; line-height: 1.5; }
    label { display: block; font-size: 0.75rem; font-weight: 600; color: #6b7a99; margin-bottom: 4px; }
    input[type="text"] { width: 100%; padding: 10px 12px; border: 1px solid #d8dff0; border-radius: 7px; font-family: inherit; font-size: 0.9rem; }
    input:focus { outline: none; border-color: #1a2744; }
    .btn { width: 100%; padding: 12px; background: #f5a623; border: none; border-radius: 7px; font-family: inherit; font-size: 0.9rem; font-weight: 700; color: #1a2744; cursor: pointer; margin-top: 24px; }
    .btn:hover { background: #d4891a; }
    .msg { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 0.85rem; text-align: center; }
    .msg.success { background: #d4f0e0; color: #1a6e3e; }
    .msg.error { background: #fdd9d7; color: #7a1a17; }
    .info-box { background: #f0f3f9; padding: 14px; border-radius: 8px; margin-top: 16px; font-size: 0.82rem; color: #4a5a77; line-height: 1.5; }
    .info-box strong { color: #1a2744; }
    .back-link { text-align: center; margin-top: 20px; font-size: 0.85rem; }
    .back-link a { color: #1a2744; font-weight: 600; text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }
    @media (max-width: 500px) { .box { padding: 32px 24px; } }
  </style>
</head>
<body>
<div class="box">
  <h1>🔑 Reset Password</h1>
  <p>Enter your username and we'll show you the reset instructions.</p>
  
  <label>Username</label>
  <input type="text" id="username" placeholder="Enter your username" />
  
  <button class="btn" onclick="submitReset()">Get Reset Instructions</button>
  
  <div id="result"></div>
  
  <div class="back-link">
    <a href="/login">← Back to Login</a>
  </div>
</div>

<script>
async function submitReset() {
  const username = document.getElementById("username").value.trim();
  const result = document.getElementById("result");
  
  if (!username) {
    result.innerHTML = '<div class="msg error">Please enter your username.</div>';
    return;
  }
  
  try {
    const res = await fetch("/api/forgot-password", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username})
    });
    
    const data = await res.json();
    
    if (data.success) {
      result.innerHTML = `
        <div class="msg success">✅ Account found!</div>
        <div class="info-box">
          <strong>What to do next:</strong><br><br>
          Please contact the administrator to reset your password.<br><br>
          📧 Email: <strong>mlayjoline3@gmail.com</strong><br>
          📱 WhatsApp: <strong>+255 717445380</strong>
        </div>
      `;
    } else {
      result.innerHTML = '<div class="msg error">❌ No account found with that username.</div>';
    }
  } catch (e) {
    result.innerHTML = '<div class="msg error">Network error. Please try again.</div>';
  }
}

document.addEventListener("keypress", function(e) {
  if (e.key === "Enter") submitReset();
});
</script>
</body>
</html>
